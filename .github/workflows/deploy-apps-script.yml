name: Deploy Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [[ -z "$CLASPRC_JSON" ]]; then
            echo "Missing required secret: CLASPRC_JSON"
            exit 1
          fi
          if [[ -z "$SCRIPT_ID" ]]; then
            echo "Missing required secret: SCRIPT_ID"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp auth
        run: |
          mkdir -p ~/.config
          cat <<'EOF' > ~/.clasprc.json
          ${{ secrets.CLASPRC_JSON }}
          EOF
          printf '%s' '{"scriptId":"${{ secrets.SCRIPT_ID }}"}' > .clasp.json

      - name: Build and deploy to Apps Script
        run: npm run push

      - name: Verify deployment is synced
        shell: bash
        run: |
          clasp status > /tmp/clasp-status.txt 2>&1 || {
            cat /tmp/clasp-status.txt
            echo "Deployment verification failed: clasp status could not complete."
            exit 1
          }

          cat /tmp/clasp-status.txt

          if grep -Ei "changes detected|not synced|not pushed|not uploaded|modified|pending" /tmp/clasp-status.txt >/dev/null; then
            echo "Deployment verification failed: the Apps Script project still reports pending changes."
            exit 1
          fi

          echo "Deployment verification passed: Apps Script is in sync with the pushed code."
